name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: web (lint, type-check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm --filter @edusphere/web lint

      - name: Type-check
        run: pnpm --filter @edusphere/web type-check

      - name: Build
        run: pnpm --filter @edusphere/web build

  mobile:
    name: mobile (lint, type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false

      - name: Type-check
        run: pnpm --filter @edusphere/mobile type-check

  api:
    name: api (lint, type-check, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edusphere
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: edusphere
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edusphere"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Phase 7.2 — nécessaire pour les tests de rate limiting du login (app/core/rate_limit.py).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # DATABASE_URL : rôle superutilisateur, migrations Alembic uniquement.
      DATABASE_URL: postgresql+asyncpg://edusphere:ci_only_password@localhost:5432/edusphere
      # APP_DATABASE_URL : rôle applicatif non-superutilisateur (nécessaire pour que RLS
      # s'applique réellement) — créé par la migration 0002 avec ce mot de passe.
      APP_DB_PASSWORD: ci_only_app_password
      APP_DATABASE_URL: postgresql+asyncpg://edusphere_app:ci_only_app_password@localhost:5432/edusphere
      JWT_SECRET_KEY: ci_only_not_for_production
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy app

      - name: Migrate
        run: alembic upgrade head

      - name: Test
        run: pytest
