services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edusphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-edusphere}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edusphere}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-edusphere}:${POSTGRES_PASSWORD:-changeme_local_only}@db:5432/${POSTGRES_DB:-edusphere}
      APP_DATABASE_URL: postgresql+asyncpg://edusphere_app:${APP_DB_PASSWORD:-changeme_app_role_local_only}@db:5432/${POSTGRES_DB:-edusphere}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Phase 14 — StorageProvider (app/core/storage.py) écrit sous STORAGE_LOCAL_PATH (./storage,
      # résolu en /app/storage dans le conteneur : WORKDIR /app). Sans ce bind mount, chaque photo
      # élève, document, logo école et PDF de bulletin vivait uniquement dans la couche writable
      # du conteneur et disparaissait à toute recréation (`up --build`, `rm`, remplacement d'image).
      # Chemin hôte déjà anticipé par le projet (voir apps/api/.gitignore et .dockerignore
      # "storage") mais jamais réellement monté jusqu'ici.
      - ./apps/api/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Phase 16 — liveness (GET /health), pas readiness (GET /ready) : un check Docker doit
      # décider s'il faut redémarrer LE CONTENEUR API, pas s'il faut redémarrer PostgreSQL (que
      # /ready vérifierait). L'image (python:3.12-slim) n'a ni curl ni wget — urllib de la
      # bibliothèque standard évite d'ajouter un paquet système juste pour ce check.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        # 2026-11-24 — mesure d'audience Umami, facultative (vides = aucune mesure) : voir docs/deployment/UMAMI.md.
        NEXT_PUBLIC_UMAMI_SRC: ${NEXT_PUBLIC_UMAMI_SRC:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  # 2026-11-24 — mesure d'audience Umami, hébergée sur le serveur (docs/deployment/UMAMI.md). Profil
  # « analytics » : ne démarre qu'avec `docker compose --profile analytics up -d umami`, jamais avec les
  # commandes habituelles. Base `umami` dans le même PostgreSQL, rôle et mot de passe dédiés. Image figée
  # par son empreinte (UMAMI_IMAGE), relevée lors de l'installation.
  umami:
    image: ${UMAMI_IMAGE:-ghcr.io/umami-software/umami:latest}
    profiles: ["analytics"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?UMAMI_DB_PASSWORD manquant dans .env}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET manquant dans .env}
      DISABLE_TELEMETRY: "1"
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
