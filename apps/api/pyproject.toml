[project]
name = "edulinkage-api"
version = "0.0.0"
description = "EduLinkage API — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "sqlalchemy==2.0.31",
    "asyncpg==0.29.0",
    "alembic==1.13.2",
    "redis==5.0.7",
    "bcrypt==4.1.3",
    "pyjwt==2.8.0",
    "openpyxl==3.1.5",
    "xhtml2pdf==0.2.17",
    "qrcode[pil]==8.2",
    "jinja2==3.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.26.0",
    "httpx==0.27.0",
    "ruff==0.5.1",
    "mypy==1.10.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Une seule boucle pour toute la session (tests ET fixtures async) : le moteur SQLAlchemy
# (app/db/session.py) et le client Redis (app/core/rate_limit.py) sont des singletons dont les
# connexions restent liées à la boucle qui les a ouvertes.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
